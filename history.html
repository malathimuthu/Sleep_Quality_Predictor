<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction History</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
}

.navbar{
    background:#1e293b;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    margin:40px auto;
}

.table-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f5f5f5;
}

.good{
    color:green;
    font-weight:bold;
}

.poor{
    color:red;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 25px;
    border-radius:8px;
}

.btn:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="navbar">
📜 Prediction History
</div>

<div class="container">

<div class="table-box">

<table>

<tr>
<th>Date</th>
<th>Sleep Hours</th>
<th>Prediction</th>
<th>Status</th>
</tr>

<tr>
<td>23-07-2026</td>
<td>8</td>
<td class="good">Good Sleep 😴</td>
<td>✅ Healthy</td>
</tr>

<tr>
<td>22-07-2026</td>
<td>5</td>
<td class="poor">Poor Sleep 😔</td>
<td>⚠ Improve</td>
</tr>

<tr>
<td>21-07-2026</td>
<td>7</td>
<td class="good">Good Sleep 😴</td>
<td>✅ Healthy</td>
</tr>

</table>

<a href="/" class="btn">🏠 Back to Home</a>

</div>

</div>

</body>
</html>
