<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5ff;
}

.navbar{
    background:#1e293b;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
    color:#2563eb;
    text-align:center;
}

label{
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.info{
    margin-top:30px;
    text-align:center;
    color:#444;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 25px;
    border-radius:8px;
}

.btn:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="navbar">
📞 Contact Us
</div>

<div class="container">

<div class="card">

<h2>Get in Touch</h2>

<form>

<label>Your Name</label>
<input type="text" placeholder="Enter your name">

<label>Email Address</label>
<input type="email" placeholder="Enter your email">

<label>Message</label>
<textarea rows="5" placeholder="Write your message"></textarea>

<button type="submit">Send Message</button>

</form>

<div class="info">

<p>📧 Email: sleepquality@gmail.com</p>

<p>📱 Phone: +91 9876543210</p>

<p>📍 Location: Karur, Tamil Nadu</p>

<a href="/" class="btn">🏠 Back to Home</a>

</div>

</div>

</div>

</body>
</html>
